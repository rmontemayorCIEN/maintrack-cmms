# Despliegue continuo a Cloud Run.
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_SERVICE=maintrack-cmms,_SQL_INSTANCE=PROYECTO:REGION:INSTANCIA
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}", "."]

  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}"]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}
      - --region=${_REGION}
      - --platform=managed
      - --port=8080
      - --cpu=1
      - --memory=1Gi
      - --min-instances=0
      - --max-instances=10
      - --add-cloudsql-instances=${_SQL_INSTANCE}
      - --set-secrets=DATABASE_URL=cmms-database-url:latest,AUTH_SECRET=cmms-auth-secret:latest,CRON_SECRET=cmms-cron-secret:latest
      - --allow-unauthenticated

substitutions:
  _REGION: us-central1
  _SERVICE: maintrack-cmms
  _SQL_INSTANCE: ""
  _IMAGE: gcr.io/${PROJECT_ID}/maintrack-cmms:${SHORT_SHA}

images:
  - ${_IMAGE}

options:
  logging: CLOUD_LOGGING_ONLY
